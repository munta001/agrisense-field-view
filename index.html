    <link
      rel="icon"
      type="image/jpeg"

    <meta

    />

    <!--
      Paint the brand the visitor already knows before any app code runs, so the
      page never opens in a placeholder brand. Key must match BRANDING_STORAGE_KEY
      in src/lib/platform-branding.ts.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("platform_branding");
          if (!raw) return;
          var brand = JSON.parse(raw);
          if (!brand) return;
          if (brand.platform_name) document.title = brand.platform_name;
          if (brand.vars) {
            var root = document.documentElement;
            for (var key in brand.vars) root.style.setProperty(key, brand.vars[key]);
          }
          if (brand.logo_url) {
            var icon = document.querySelector('link[rel="icon"]');
            if (icon) icon.href = brand.logo_url;
          }
        } catch (e) {
          /* no remembered brand — the app will fetch it */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
