<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>ThirdEye</title>

    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta name="description" content="Sensor monitoring, field maps and alerts for farms and estates." />

    <meta property="og:title" content="ThirdEye" />
    <meta property="og:description" content="Sensor monitoring, field maps and alerts for farms and estates." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Paint the brand the visitor already knows before any app code runs, so the
      page never opens in a placeholder brand. Key must match BRANDING_STORAGE_KEY
      in src/lib/platform-branding.ts.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("platform_branding");
          if (!raw) return;
          var brand = JSON.parse(raw);
          if (!brand) return;
          if (brand.platform_name) document.title = brand.platform_name;
          if (brand.vars) {
            var root = document.documentElement;
            for (var key in brand.vars) root.style.setProperty(key, brand.vars[key]);
          }
          if (brand.logo_url) {
            var icon = document.querySelector('link[rel="icon"]');
            if (icon) icon.href = brand.logo_url;
          }
        } catch (e) {
          /* no remembered brand — the app will fetch it */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
